name: Publish Anthropic IPO PDF
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_anthropic_ipo.py'
      - '.github/workflows/publish-anthropic-ipo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: python scripts/build_anthropic_ipo.py
      - name: Commit published PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/achive-004.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish Anthropic IPO research PDF"
            git push
          fi
