name: Publish Tesla research PDF
on:
  push:
    branches: [main]
    paths:
      - scripts/build_tesla_paper.py
      - .github/workflows/publish-tesla.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF engine
        run: pip install reportlab
      - name: Build paper
        run: python scripts/build_tesla_paper.py
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/achive-002.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish Tesla stock research PDF"
            git push
          fi
